name: Large corpus

on:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  large-images:
    name: Large photo budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Use an independent Ubuntu mirror when Canonical's hosts do not resolve
        run: |
          # A Canonical DNS outage makes the Ubuntu package hosts unresolvable
          # on hosted runners; fall back to an independent mirror for this run.
          if ! getent hosts archive.ubuntu.com >/dev/null 2>&1 ||
             ! getent hosts security.ubuntu.com >/dev/null 2>&1; then
            for file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
              [ -f "$file" ] || continue
              sudo sed -i -E \
                's#https?://[a-z0-9.-]*ubuntu\.com/ubuntu/?#https://mirrors.edge.kernel.org/ubuntu/#g' \
                "$file"
            done
          fi

      - name: Install a virtual display and software rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libudev-dev libxcb1 libxcb-render0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-randr0
      - name: Download the hash-pinned external corpus
        run: scripts/fetch-external-corpus.sh
      - name: Import the external corpus
        run: cargo test --locked --test external_corpus -- --ignored --nocapture
      - name: Import and preview a multi-megabyte photo
        run: cargo test --locked --test large_images -- --ignored --nocapture
