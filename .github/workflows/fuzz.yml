name: Fuzz

on:
  schedule:
    - cron: "23 4 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parsers:
    name: Parser fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run every target for one minute
        env:
          RUST_BACKTRACE: 1
          RUSTUP_TOOLCHAIN: nightly
        run: |
          cd fuzz
          for target in svg dxf hpgl pdf project gcode; do
            echo "::group::$target"
            cargo fuzz run "$target" --target x86_64-unknown-linux-gnu -- \
              -max_total_time=60 -timeout=10 -rss_limit_mb=2048
            echo "::endgroup::"
          done
      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
