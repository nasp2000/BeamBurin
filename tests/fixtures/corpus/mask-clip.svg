<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="20mm" height="20mm" viewBox="0 0 20 20">
  <defs>
    <clipPath id="clip"><rect x="2" y="2" width="14" height="14"/></clipPath>
    <mask id="fade"><rect x="0" y="0" width="20" height="20" fill="white"/><circle cx="16" cy="16" r="4" fill="black"/></mask>
  </defs>
  <rect x="0" y="0" width="20" height="20" fill="#cccccc" clip-path="url(#clip)" mask="url(#fade)"/>
